<article class="card bg-base-100 shadow-sm w-full max-w-xl rounded-lg overflow-hidden animate-pulse">
  <div class="flex gap-4 p-4 items-start">

    <!-- thumbnail placeholder -->
    <div class="w-16 h-16 bg-base-300 rounded-md"></div>

    <!-- content -->
    <div class="flex-1 min-w-0">

      <div class="flex items-start justify-between gap-3">

        <!-- title + subtitle -->
        <div class="min-w-0 space-y-2">
          <div class="h-4 bg-base-300 rounded w-32"></div>
          <div class="h-3 bg-base-300 rounded w-24"></div>
        </div>

        <!-- actions -->
        <div class="flex items-center gap-2 ml-3">
          <div class="btn btn-ghost btn-square btn-sm p-2 bg-base-300"></div>
          <div class="btn btn-ghost btn-square btn-sm p-2 bg-base-300"></div>
        </div>
      </div>

      <!-- description -->
      <div class="mt-2 space-y-2">
        <div class="h-3 bg-base-300 rounded w-full"></div>
        <div class="h-3 bg-base-300 rounded w-5/6"></div>
        <div class="h-3 bg-base-300 rounded w-4/6"></div>
      </div>

    </div>
  </div>
</article>
