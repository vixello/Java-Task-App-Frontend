<!-- Button to open modal -->
<button class="btn btn-primary" (click)="open()">Create Task</button>

<!-- Modal -->
<dialog #taskDialog class="modal">
  <div class="modal-box">
    <h3 class="font-bold text-lg mb-4">Create Task</h3>

    <form (ngSubmit)="submit()" class="space-y-3">

      <input class="input input-bordered w-full" 
             placeholder="Title" 
             [(ngModel)]="title" 
             name="title">

      <textarea class="textarea textarea-bordered w-full" 
                placeholder="Description" 
                [(ngModel)]="description" 
                name="description"></textarea>

      <input type="date" 
             class="input input-bordered w-full" 
             [(ngModel)]="dueDate" 
             name="dueDate">

      <select class="select select-bordered w-full" 
              [(ngModel)]="priority" 
              name="priority">
        <option>LOW</option>
        <option>MEDIUM</option>
        <option>HIGH</option>
      </select>

      <button class="btn btn-primary w-full">Create</button>
    </form>

    <div class="modal-action">
      <button class="btn" (click)="close()">Close</button>
    </div>
  </div>
</dialog>
