<!-- Compact card (single item) -->
<article class="card bg-base-100 shadow-sm w-full max-w-xl rounded-lg overflow-hidden">
    <div class="flex gap-4 p-4 items-start">
        <!-- thumbnail -->
        <div class="w-16 h-16 flex-shrink-0 rounded-md overflow-hidden flex items-center justify-center">
            <fa-icon [icon]="['fas','exclamation-circle']" class="text-red-600 text-4xl"></fa-icon>
        </div>

        <!-- content -->
        <div class="flex-1 min-w-0">
            <div class="flex items-start justify-between gap-3">
                <div class="min-w-0">
                    <h3 class="text-base font-semibold leading-tight truncate">Ellie Beilish</h3>
                    <div class="text-xs uppercase font-semibold opacity-60 truncate">Bears of a fever</div>
                </div>

                <!-- actions -->
                <div class="flex items-center gap-2 ml-3">
                    <button class="btn btn-ghost btn-square btn-sm p-2" aria-label="Play">
                        <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M6 3L20 12 6 21 6 3"></path>
                        </svg>
                    </button>

                    <button class="btn btn-ghost btn-square btn-sm p-2" aria-label="Like">
                        <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path
                                d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z">
                            </path>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- description -->
            <p class="mt-2 text-sm text-base-content/70 leading-relaxed line-clamp-3">
                "Bears of a Fever" captivated audiences with its intense energy and mysterious lyrics. Its popularity
                skyrocketed after fans shared it widely online, earning Ellie critical acclaim.
            </p>
        </div>
    </div>
</article>
